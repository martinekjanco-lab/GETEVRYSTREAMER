
name: Build TryTP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build the mod
        working-directory: trytp-fabric-1.21.11
        run: gradle build

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: trytp-jar
          path: trytp-fabric-1.21.11/build/libs/trytp-1.0.0.jar
